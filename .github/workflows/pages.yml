name: Pages

# Publishes the project page and the short installer URL:
#   https://byteforgestudiolab.github.io/RunTime-Now/          (site/index.html)
#   https://byteforgestudiolab.github.io/RunTime-Now/install   (install.sh)
on:
  push:
    branches: [main]
    paths: ["site/**", "install.sh", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp install.sh _site/install
          cp install.sh _site/install.sh
          cp assets/*.png _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
