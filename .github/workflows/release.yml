name: Release

# Push a tag like v1.6.0 to publish a release:
#   git tag -a v1.6.0 -m "RunTime-Now 1.6.0" && git push origin v1.6.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Alpine (musl) + static linking: one binary that runs on every Linux distro.
      # The exact binary that gets published is also the one that runs the test suite.
      - name: Build and test (static, Alpine)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION="${GITHUB_REF_NAME#v}" alpine:3.20 sh -euxc '
            apk add --no-cache build-base cmake linux-headers bash python3 curl tar
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRTN_STATIC=ON
            cmake --build build -j"$(nproc)"
            strip build/rtn
            ./build/rtn --version | grep -q " $VERSION " || { echo "tag v$VERSION does not match the version in CMakeLists.txt"; exit 1; }
            tests/run.sh
          '

      - name: Package
        run: |
          name="rtn-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp build/rtn LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          file build/rtn

      - uses: actions/upload-artifact@v4
        with:
          name: rtn-linux-${{ matrix.arch }}
          path: dist/rtn-linux-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums, VERSION file and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum rtn-linux-*.tar.gz > SHA256SUMS
          echo "$version" > VERSION   # read by `rtn upgrade` and install.sh via releases/latest/download/VERSION
          cd ..
          {
            if [ -f "assets/rtn-$version.png" ]; then
              echo "![RunTime-Now $version](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/assets/rtn-$version.png)"
              echo
            fi
            awk -v v="$version" 'index($0, "## " v) == 1 { f = 1; next } /^## / && f { exit } f' CHANGELOG.md
            echo
            echo "### Install"
            echo
            echo '```sh'
            owner="${GITHUB_REPOSITORY_OWNER,,}"; repo="${GITHUB_REPOSITORY#*/}"
            echo "curl -fsSL https://${owner}.github.io/${repo}/install | bash"
            echo '```'
            echo
            echo 'Already installed? Run `rtn upgrade`.'
            if [ -f assets/rtn-install.png ]; then
              echo
              echo "![Install in one line](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/assets/rtn-install.png)"
            fi
          } > notes.md
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "RunTime-Now ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
